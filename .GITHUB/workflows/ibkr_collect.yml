name: IBKR 대차 수집 (15분)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ibkr-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 수집 실행
        run: python collect_ibkr.py

      - name: 저장소에 반영
        run: |
          git config user.name "ibkr-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "ibkr $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
